# TigoMeNote · Build APK (Capacitor) — gumagawa ng APK sa GitHub, walang kailangang i-install sa PC
# Kusang tumatakbo kapag nagbago ang apk/** o ang version sa config.js; puwede ring manual (Actions → Build APK → Run).
# Signing: secret na APK_KEYSTORE_PASSWORD (≥20 characters). Ang key ay ginagawa mula sa password tuwing build (apk/derive-key.py);
#          walang key file sa repo. Ang SHA-256 ng certificate (public) ay nasa apk/keys/cert-sha256.txt para siguradong pareho.
#          Kapag walang secret: debug APK lang (pang-test, nasa Artifacts).
# Release: "app-v<version>" sa GitHub Releases, may TigoMeNote.apk (link para sa Get app page).
name: Build APK
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Aling app (main | chat | tigo); blangko = lahat"
        default: ""
  push:
    branches: [main]
    paths: ["apk/**", "assets/js/config.js", ".github/workflows/apk.yml"]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event.inputs.app && format('["{0}"]', github.event.inputs.app) || '["main","chat"]') }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Version
        run: echo "VER=$(grep -oP 'version:\s*"\K[^"]+' assets/js/config.js)" >> $GITHUB_ENV
      - name: Capacitor + web files
        run: |
          cd apk/$APP && npm install --no-audit --no-fund
          cd ../.. && python3 apk/build-web.py $APP
          cd apk/$APP && npx cap add android && npx cap sync android
          cd ../.. && python3 apk/patch-android.py $APP
      - name: Push notifications (Firebase)
        env: { GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: python3 apk/add-firebase.py $APP
      - name: Signing key
        env: { PW: "${{ secrets.APK_KEYSTORE_PASSWORD }}" }
        run: |
          if [ -z "$PW" ]; then echo "::warning::Walang APK_KEYSTORE_PASSWORD secret → debug APK lang"; echo "SIGN=debug" >> $GITHUB_ENV; exit 0; fi
          if [ ${#PW} -lt 20 ]; then echo "::error::APK_KEYSTORE_PASSWORD dapat 20+ characters"; exit 1; fi
          pip install --quiet "cryptography==44.0.3"
          FP=$(PW="$PW" python3 apk/derive-key.py "$RUNNER_TEMP/release.p12")
          echo "KS=$RUNNER_TEMP/release.p12" >> $GITHUB_ENV
          if [ -f apk/keys/cert-sha256.txt ]; then
            [ "$FP" = "$(tr -d '[:space:]' < apk/keys/cert-sha256.txt)" ] || { echo "::error::Iba ang signing key sa dati (nagbago ba ang APK_KEYSTORE_PASSWORD?)"; exit 1; }
          else
            echo "$FP" > apk/keys/cert-sha256.txt; echo "NEWKEY=1" >> $GITHUB_ENV
          fi
          echo "SIGN=release" >> $GITHUB_ENV
      - name: Build
        run: |
          cd apk/$APP/android && chmod +x gradlew
          T=assembleDebug; [ "$SIGN" = release ] && T=assembleRelease
          set +e; ./gradlew --no-daemon $T > "$RUNNER_TEMP/gradle.log" 2>&1; ST=$?; set -e
          tail -60 "$RUNNER_TEMP/gradle.log"
          if [ $ST -ne 0 ]; then
            # ipakita ang dahilan bilang annotation (nababasa kahit walang access sa logs)
            MSG=$(grep -E "What went wrong|error:|ERROR|Execution failed|> " "$RUNNER_TEMP/gradle.log" | grep -v "^> Task" | head -25 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$MSG"; exit $ST
          fi
      - name: Sign
        env: { PW: "${{ secrets.APK_KEYSTORE_PASSWORD }}" }
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('apk/$APP/capacitor.config.json'))['appName'].replace(' ',''))")
          mkdir -p out
          if [ "$SIGN" = release ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 apk/$APP/android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
            $BT/apksigner sign --ks "$KS" --ks-type PKCS12 --ks-key-alias tigomenote --ks-pass env:PW --key-pass env:PW --out out/$NAME.apk out/aligned.apk
            $BT/apksigner verify out/$NAME.apk && rm out/aligned.apk
          else
            cp apk/$APP/android/app/build/outputs/apk/debug/app-debug.apk out/$NAME-debug.apk
          fi
          ls -la out
      - name: Save certificate fingerprint (public)
        if: env.NEWKEY == '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/keys/cert-sha256.txt && git commit -m "APK signing certificate fingerprint [skip ci]" && git push
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APP }}-apk-${{ env.VER }}"
          path: out/*.apk
          retention-days: 14
      - name: GitHub Release
        if: env.SIGN == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${APP}-v${VER}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "APK ${APP} ${VER}" --latest=false
          gh release upload "$TAG" out/*.apk --clobber
      - name: Update app-version.json (Get app page + auto-update)
        if: env.SIGN == 'release'
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('apk/$APP/capacitor.config.json'))['appName'].replace(' ',''))")
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for TRY in 1 2 3 4 5; do
            git pull -q --rebase origin main
            python3 apk/update-version.py "$APP" "$VER" "out/$NAME.apk" "${{ github.repository }}"
            git add app-version.json
            git diff --cached --quiet && break
            git commit -q -m "app-version.json: $APP $VER"
            if git push -q; then break; fi
            git reset -q --hard HEAD~1; sleep $((TRY * 3))
          done
