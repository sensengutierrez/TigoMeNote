# TigoMeNote · Build APK (Capacitor) — gumagawa ng APK sa GitHub, walang kailangang i-install sa PC
# Kusang tumatakbo kapag nagbago ang apk/** o ang version sa config.js; puwede ring manual (Actions → Build APK → Run).
# Signing: secret na APK_KEYSTORE_PASSWORD (≥20 characters). Sa unang build, gagawa ng apk/keys/release.p12 at ise-save sa repo.
#          Kapag walang secret: debug APK lang (pang-test, nasa Artifacts).
# Release: "app-v<version>" sa GitHub Releases, may TigoMeNote.apk (link para sa Get app page).
name: Build APK
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Aling app (main | tigo | chat)"
        default: main
  push:
    branches: [main]
    paths: ["apk/**", "assets/js/config.js", ".github/workflows/apk.yml"]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event.inputs.app || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Version
        run: echo "VER=$(grep -oP 'version:\s*"\K[^"]+' assets/js/config.js)" >> $GITHUB_ENV
      - name: Capacitor + web files
        run: |
          cd apk/$APP && npm install --no-audit --no-fund
          cd ../.. && python3 apk/build-web.py $APP
          cd apk/$APP && npx cap add android && npx cap sync android
          cd ../.. && python3 apk/patch-android.py $APP
      - name: Signing key
        env: { PW: "${{ secrets.APK_KEYSTORE_PASSWORD }}" }
        run: |
          if [ -z "$PW" ]; then echo "::warning::Walang APK_KEYSTORE_PASSWORD secret → debug APK lang"; echo "SIGN=debug" >> $GITHUB_ENV; exit 0; fi
          if [ ${#PW} -lt 20 ]; then echo "::error::APK_KEYSTORE_PASSWORD dapat 20+ characters"; exit 1; fi
          if [ ! -f apk/keys/release.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore apk/keys/release.p12 -alias tigomenote -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PW" -keypass "$PW" -dname "CN=TigoMeNote, O=TigoMeNote, C=BH"
            echo "NEWKEY=1" >> $GITHUB_ENV
          fi
          keytool -list -keystore apk/keys/release.p12 -storepass "$PW" > /dev/null
          echo "SIGN=release" >> $GITHUB_ENV
      - name: Build
        run: |
          cd apk/$APP/android && chmod +x gradlew
          if [ "$SIGN" = release ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: Sign
        env: { PW: "${{ secrets.APK_KEYSTORE_PASSWORD }}" }
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('apk/$APP/capacitor.config.json'))['appName'].replace(' ',''))")
          mkdir -p out
          if [ "$SIGN" = release ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 apk/$APP/android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
            $BT/apksigner sign --ks apk/keys/release.p12 --ks-key-alias tigomenote --ks-pass env:PW --key-pass env:PW --out out/$NAME.apk out/aligned.apk
            $BT/apksigner verify out/$NAME.apk && rm out/aligned.apk
          else
            cp apk/$APP/android/app/build/outputs/apk/debug/app-debug.apk out/$NAME-debug.apk
          fi
          ls -la out
      - name: Save new signing key to repo
        if: env.NEWKEY == '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/keys/release.p12 && git commit -m "APK signing key (naka-lock sa APK_KEYSTORE_PASSWORD) [skip ci]" && git push
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APP }}-apk-${{ env.VER }}"
          path: out/*.apk
          retention-days: 14
      - name: GitHub Release
        if: env.SIGN == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${APP}-v${VER}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "APK ${APP} ${VER}" --latest=false
          gh release upload "$TAG" out/*.apk --clobber
