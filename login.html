<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in · TigoMeNote</title>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
</head>
<body class="auth">
  <aside class="auth-art" aria-hidden="true">
    <a class="brand" href="./"><span class="brand-mark">T</span><span>Tigo<b>Me</b>Note</span></a>
    <div class="auth-quote">
      <p>Isang note bawat araw.<br>Sa'yo ang original,<br><span>ikaw ang pipili kung ano ang ishe-share.</span></p>
    </div>
    <div class="auth-tiles">
      <span class="t t1"></span><span class="t t2"></span><span class="t t3"></span><span class="t t4"></span>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-top">
      <a class="brand auth-brand-sm" href="./"><span class="brand-mark">T</span><span>Tigo<b>Me</b>Note</span></a>
      <button class="icon-btn js-theme" type="button" aria-label="Toggle dark mode"></button>
    </div>

    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="muted" id="authSub">Mag-sign in para ituloy ang Daily mo.</p>

      <div class="segmented auth-tabs" role="tablist" aria-label="Sign in or register">
        <button type="button" role="tab" id="tabLogin" data-mode="login" aria-pressed="true">Sign in</button>
        <button type="button" role="tab" id="tabRegister" data-mode="register" aria-pressed="false">Create account</button>
      </div>

      <form id="authForm" class="auth-form" novalidate>
        <div class="field reg-only hidden">
          <label for="fName">Display name</label>
          <input class="input" id="fName" name="display_name" maxlength="40" autocomplete="name" placeholder="Juan Dela Cruz">
        </div>

        <div class="field">
          <label for="fUser">Username</label>
          <div class="input-wrap at-wrap">
            <span class="at">@</span>
            <input class="input" id="fUser" name="username" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="yourname">
          </div>
          <span class="hint reg-only hidden">3–24 characters: letters, numbers, _ o .</span>
        </div>

        <div class="field">
          <label for="fPass">Password</label>
          <div class="input-wrap">
            <input class="input" id="fPass" name="password" type="password" maxlength="72" autocomplete="current-password" placeholder="••••••••">
            <button class="icon-btn" type="button" id="togglePass" aria-label="Show password"></button>
          </div>
          <div class="strength reg-only hidden" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <span class="hint reg-only hidden" id="passHint">At least 8 characters.</span>
        </div>

        <label class="check"><input type="checkbox" id="fRemember" checked> Keep me signed in on this device</label>

        <div class="alert hidden" id="authMsg" role="alert"></div>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="authBtn">Sign in</button>
      </form>

      <p class="faint small auth-foot">By continuing, private Daily notes mo ay nasa device mo lang.</p>
    </div>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
