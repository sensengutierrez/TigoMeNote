<body data-page="sounds" data-title="Sound Maker">
  <main id="page" class="page smp-page">
    <div class="smp-head">
      <div><h1>Sound Maker</h1><p class="faint">Make your own beat and use it on your posts and status. 🎵</p></div>
      <button type="button" class="btn btn-ghost btn-sm" id="smpNew">＋ New sound</button>
    </div>
    <div class="smp-layout">
      <section class="card" id="smpEditor" aria-label="Sound editor"></section>
      <aside class="card smp-lib" aria-label="My sounds">
        <h3>🎛️ My sounds</h3>
        <div id="smpList"><p class="faint small">Loading…</p></div>
        <p class="faint small">Up to 30 sounds. When you post a photo or status, pick yours under “My sounds”.</p>
      </aside>
    </div>
