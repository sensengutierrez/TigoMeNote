<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Daily · TigoMeNote</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <script src="../assets/js/theme.js?v=0.8.2"></script>
  <script src="../assets/js/config.js?v=0.8.2"></script>
  <script src="../assets/js/i18n.js?v=0.8.2"></script>
  <script src="../assets/js/auth-guard.js?v=0.8.2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css?v=0.8.2">
  <link rel="stylesheet" href="../assets/css/base.css?v=0.8.2">
  <link rel="stylesheet" href="../assets/css/components.css?v=0.8.2">
  <link rel="stylesheet" href="../assets/css/shell.css?v=0.8.2">
  <link rel="stylesheet" href="../assets/css/safety.css?v=0.8.2">
  <link rel="stylesheet" href="../assets/css/pages/daily.css?v=0.8.2">
</head>
<body data-page="home">
  <main id="page" class="page">
    <header class="page-head">
      <div>
        <div class="eyebrow" id="today"></div>
        <h1 id="greet">Hello!</h1>
        <p class="lead">Your notes for today. Private Daily notes stay on your device.</p>
      </div>
    </header>

    <div class="layout">
     <div class="stack">
      <div class="composer card">
        <span class="avatar" id="meAvatar" style="--size:42px"></span>
        <button class="composer-input" type="button" disabled>What's your note today?</button>
        <div class="composer-actions">
          <button class="icon-btn" type="button" disabled aria-label="Take photo"><i data-icon="camera"></i></button>
          <span class="badge badge-accent">Soon</span>
        </div>
      </div>

      <section class="card empty feed-empty">
        <div class="empty-art"><i data-icon="sun" data-size="lg"></i></div>
        <h3>No notes yet today</h3>
        <p>When Daily is ready, your notes, photos and videos for today will show up here.</p>
      </section>
     </div>

     <aside class="layout-aside">
      <section class="card wx-card" id="weather" aria-label="Weather"></section>
      <section class="card">
        <h3 class="side-title">This week</h3>
        <div class="week" id="week" aria-label="This week"></div>
      </section>
      <section class="card">
        <h3 class="side-title">Today</h3>
        <div class="today-stats">
          <div><b id="tNotes">0</b><span>Notes</span></div>
          <div><b id="tPhotos">0</b><span>Photos</span></div>
          <div><b id="tVideos">0</b><span>Videos</span></div>
        </div>
      </section>
      <section class="card card-flat side-note">
        <i data-icon="lock"></i>
        <p>Your Daily notes are saved on your device only. You choose what to share.</p>
      </section>
     </aside>
    </div>
  </main>

  <script src="../assets/js/icons.js?v=0.8.2"></script>
  <script src="../assets/js/nav-items.js?v=0.8.2"></script>
  <script src="../assets/js/components/app-shell.js?v=0.8.2"></script>
  <script src="../assets/js/media-store.js?v=0.8.2"></script>
  <script src="../assets/js/components/weather.js?v=0.8.2"></script>
  <script src="../assets/js/api.js?v=0.8.2"></script>
  <script src="../assets/js/moderation-check.js?v=0.8.2"></script>
  <script src="../assets/js/components/mod-guard.js?v=0.8.2"></script>
  <script src="../assets/js/native-bridge.js?v=0.8.2"></script>
  <script src="../assets/js/push-setup.js?v=0.8.2"></script>
  <script src="../assets/js/components/sos-overlay.js?v=0.8.2"></script>
  <script src="../assets/js/safety-watch.js?v=0.8.2"></script>
  <script src="../assets/js/location-share.js?v=0.8.2"></script>
  <script src="../assets/js/wellbeing.js?v=0.8.2"></script>
  <script src="../assets/js/notif-badge.js?v=0.8.2"></script>
  <script src="../assets/js/post-queue.js?v=0.8.2"></script>
  <script src="../assets/js/pages/daily.js?v=0.8.2"></script>
</body>
</html>
