<body data-page="home">
  <main id="page" class="page">
    <header class="page-head">
      <div>
        <div class="eyebrow" id="today"></div>
        <h1 id="greet">Hello!</h1>
        <p class="lead">Your notes, to-dos and reminders. Private Daily notes stay on your device.</p>
      </div>
    </header>

    <div class="layout">
     <div class="stack">
      <div class="composer card dn-composer" id="dnComposer"></div>
      <section class="card dn-otd hidden" id="dnOtd" aria-label="On this day"></section>
      <div class="dn-list" id="dnList"></div>
     </div>

     <aside class="layout-aside">
      <section class="card wx-card" id="weather" aria-label="Weather"></section>
      <section class="card">
        <div class="side-head"><h3 class="side-title" id="weekTitle">This week</h3>
          <button class="btn btn-ghost btn-sm" type="button" id="calBtn"><i data-icon="calendar" data-size="sm"></i>Calendar</button></div>
        <div class="week" id="week" aria-label="This week"></div>
      </section>
      <section class="card">
        <h3 class="side-title" id="moodTitle">How's your day?</h3>
        <div class="dn-moods" id="dnMood" role="group" aria-label="Mood"></div>
      </section>
      <a class="card tg-mini hidden" id="tigoCard" href="tigo.html" aria-label="Your Tigo"></a>
      <section class="card rm-card" id="remind" aria-label="Reminders and alarms"></section>
      <section class="card">
        <h3 class="side-title">Today</h3>
        <div class="today-stats">
          <div><b id="tNotes">0</b><span>Notes</span></div>
          <div><b id="tPhotos">0</b><span>Photos</span></div>
          <div><b id="tVideos">0</b><span>Videos</span></div>
        </div>
      </section>
      <section class="card" id="homeClock" aria-label="Philippines time"></section>
      <section class="card card-flat side-note">
        <i data-icon="lock"></i>
        <p>Your Daily notes are saved on your device only. You choose what to share. Reminders are saved to your account so your phone can ring.</p>
      </section>
     </aside>
    </div>
  </main>

  <script src="../assets/js/icons.js?v=0.11.22"></script>
