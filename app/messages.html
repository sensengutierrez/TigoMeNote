  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">

</head>
<body data-page="messages">
  <main id="page" class="page wide fill">
    <div class="inbox card">
      <aside class="inbox-list">
        <div class="ib-head">
          <h1>Messages</h1>
          <button class="icon-btn" type="button" data-new-chat aria-label="New message" title="New message"><i data-icon="edit"></i></button>
        </div>
        <label class="search">
          <i data-icon="search"></i>
          <span class="sr-only">Search chats</span>
          <input class="input" type="search" id="ibSearch" placeholder="Search chats">
        </label>
        <div class="segmented ib-tabs" id="ibTabs" role="tablist">
          <button type="button" data-tab="chats" aria-pressed="true">Chats</button>
          <button type="button" data-tab="requests" aria-pressed="false">Requests <span class="dot-count hidden" id="reqCount"></span></button>
        </div>
        <div class="ib-items" id="ibItems" role="list"><div class="ib-empty"><p class="faint small">Loading…</p></div></div>
      </aside>
      <section class="inbox-thread" id="thread"></section>
    </div>

    <!-- Sa TigoMeNote APK: hiwalay na app ang TigoMeNote Chat -->
    <section class="card msg-gate-card hidden" id="msgGate">
      <div class="empty">
        <div class="empty-art"><i data-icon="chat" data-size="lg"></i></div>
        <h3 id="gateTitle">TigoMeNote Chat</h3>
        <p id="gateText"></p>
        <button class="btn btn-primary" type="button" id="gateBtn"></button>
      </div>
    </section>

  </main>
  <script src="../assets/js/icons.js?v=0.11.24"></script>
  <script src="../assets/js/nav-items.js?v=0.11.24"></script>
  <script src="../assets/js/components/app-shell.js?v=0.11.24"></script>
  <script src="../assets/js/api.js?v=0.11.24"></script>
  <script src="../assets/js/moderation-check.js?v=0.11.24"></script>
  <script src="../assets/js/components/mod-guard.js?v=0.11.24"></script>
  <script src="../assets/js/native-bridge.js?v=0.11.24"></script>
  <script src="../assets/js/push-setup.js?v=0.11.24"></script>
  <script src="../assets/js/components/sos-overlay.js?v=0.11.24"></script>
  <script src="../assets/js/safety-watch.js?v=0.11.24"></script>
  <script src="../assets/js/location-share.js?v=0.11.24"></script>
  <script src="../assets/js/wellbeing.js?v=0.11.24"></script>
  <script src="../assets/js/notif-badge.js?v=0.11.24"></script>
