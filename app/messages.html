<body data-page="messages">
  <main id="page" class="page wide fill">
    <header class="page-head">
      <div>
        <h1>Messages</h1>
      </div>
    </header>

    <div class="inbox card">
      <aside class="inbox-list">
        <label class="search">
          <i data-icon="search"></i>
          <span class="sr-only">Search chats</span>
          <input class="input" type="search" placeholder="Search chats" disabled>
        </label>
        <div class="inbox-empty">
          <p class="faint small">No conversations yet.</p>
        </div>
      </aside>
      <section class="inbox-thread">
        <div class="empty">
          <div class="empty-art"><i data-icon="chat" data-size="lg"></i></div>
          <h3>Messenger is coming next</h3>
          <p>Text, voice, photos, GIFs/stickers and reactions. One account for all of TigoMeNote.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="../assets/js/pages/messages.js?v=0.8.0"></script>
