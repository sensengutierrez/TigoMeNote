<body data-page="profile">
  <main id="page" class="page">
    <section class="card p-hero">
      <div class="p-banner" id="pBanner">
        <img alt="" id="pBannerImg" class="hidden">
        <button class="p-cam p-cam-banner" type="button" id="bannerBtn" aria-label="Change cover photo"><i data-icon="camera" data-size="sm"></i><span>Cover</span></button>
      </div>
      <div class="p-main">
        <div class="p-avatar-wrap">
          <span class="avatar p-avatar" id="pAvatar"></span>
          <button class="p-cam p-cam-avatar" type="button" id="avatarBtn" aria-label="Change profile photo"><i data-icon="camera" data-size="sm"></i></button>
        </div>
        <div class="p-id">
          <h1 class="profile-name" id="pName">…</h1>
          <div class="faint" id="pUser"></div>
        </div>
        <div class="p-actions">
          <button class="btn btn-primary" type="button" id="editBtn"><i data-icon="edit" data-size="sm"></i>Edit profile</button>
        </div>
      </div>
      <div class="p-about">
        <p class="profile-bio" id="pBio"></p>
        <div class="profile-meta faint small">
          <span id="pRole" class="badge"></span>
          <span><i data-icon="calendar" data-size="sm"></i><span id="pJoined"></span></span>
        </div>
      </div>
      <div class="stats">
        <div><b id="statPosts">0</b><span>Posts</span></div>
        <button type="button" data-list="followers"><b id="statFollowers">0</b><span>Followers</span></button>
        <button type="button" data-list="following"><b id="statFollowing">0</b><span>Following</span></button>
        <div><b id="statLikes">0</b><span>Likes</span></div>
      </div>
    </section>

    <!-- My music: sariling playlist (device lang) -->
    <section class="card p-music" id="pMusic" aria-label="My music"></section>

    <!-- Family & Safety (SOS) -->
    <section class="card p-safety" id="pSafety">
      <div class="p-safety-sos" id="pSosMount"></div>
      <div class="p-safety-main">
        <h3><i data-icon="shield" data-size="sm"></i>Family &amp; Safety</h3>
        <p class="muted small" id="pSafetyTxt">Add your Family &amp; Friends. Hold SOS for 3 seconds to alert them with your location.</p>
        <div class="p-safety-people" id="pSafetyPeople"></div>
        <div class="p-safety-btns">
          <a class="btn btn-primary btn-sm" href="safety.html"><i data-icon="map" data-size="sm"></i>Locate</a>
          <a class="btn btn-ghost btn-sm" href="safety.html"><i data-icon="userPlus" data-size="sm"></i>Add Family</a>
        </div>
      </div>
    </section>

    <section class="card posts">
      <div class="q-wrap hidden" id="qWrap">
        <div class="q-head"><h3>Waiting on this device</h3><span class="faint small" id="qNet"></span></div>
        <div class="queue" id="queue"></div>
      </div>
      <div class="p-tabs" role="tablist" aria-label="Profile tabs" id="pTabs">
        <button type="button" role="tab" aria-selected="true" data-t="posts" title="Posts"><i data-icon="grid"></i><span>Posts</span></button>
        <button type="button" role="tab" aria-selected="false" data-t="private" title="Private"><i data-icon="lock"></i><span>Private</span></button>
        <button type="button" role="tab" aria-selected="false" data-t="reposts" title="Reposts"><i data-icon="repost"></i><span>Reposts</span></button>
        <button type="button" role="tab" aria-selected="false" data-t="saved" title="Saved"><i data-icon="bookmark"></i><span>Saved</span></button>
        <button type="button" role="tab" aria-selected="false" data-t="liked" title="Liked"><i data-icon="heart"></i><span>Liked</span></button>
        <button type="button" role="tab" aria-selected="false" data-t="history" title="Recently viewed"><i data-icon="clock"></i><span>History</span></button>
      </div>
      <div class="posts-head" id="postsHead">
        <div class="chips" role="group" aria-label="Filter posts" id="postChips">
          <button class="chip active" type="button" aria-pressed="true" data-f="all">All</button>
          <button class="chip" type="button" aria-pressed="false" data-f="photo">Photos</button>
          <button class="chip" type="button" aria-pressed="false" data-f="video">Videos</button>
          <button class="chip" type="button" aria-pressed="false" data-f="scheduled">Scheduled</button>
        </div>
        <label class="p-sort"><span class="sr-only">Sort</span>
          <select class="input" id="pSort">
            <option value="latest">Latest</option>
            <option value="popular">Popular</option>
            <option value="oldest">Oldest</option>
          </select>
        </label>
      </div>
      <p class="faint small p-tabnote hidden" id="tabNote"></p>
      <div class="post-grid" id="postGrid"></div>
      <div class="empty posts-empty hidden" id="postsEmpty">
        <div class="empty-art"><i data-icon="image" data-size="lg"></i></div>
        <h3 id="emptyTitle">No posts yet</h3>
        <p id="emptyText">Pick a photo or video in Gallery, then tap <b>Post</b>. Works offline.</p>
        <a class="btn btn-primary" href="gallery.html"><i data-icon="album" data-size="sm"></i>Open Gallery</a>
      </div>
    </section>
  </main>
