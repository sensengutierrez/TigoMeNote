<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Profile · TigoMeNote</title>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/posts.css">
  <link rel="stylesheet" href="../assets/css/pages/profile.css">
</head>
<body data-page="profile">
  <main id="page" class="page">
   <div class="layout aside-left">
    <aside class="layout-aside">
    <section class="profile card">
      <div class="profile-banner"></div>
      <div class="profile-body">
        <span class="avatar profile-avatar" id="pAvatar" style="--size:92px"></span>
        <div class="profile-top">
          <div>
            <h1 class="profile-name" id="pName">…</h1>
            <div class="faint" id="pUser"></div>
          </div>
          <button class="btn btn-ghost" type="button" disabled><i data-icon="edit"></i>Edit</button>
        </div>
        <p class="profile-bio" id="pBio"></p>
        <div class="profile-meta faint small">
          <span id="pRole" class="badge"></span>
          <span><i data-icon="calendar" data-size="sm"></i><span id="pJoined"></span></span>
        </div>
        <div class="stats">
          <div><b id="statPosts">0</b><span>Posts</span></div>
          <div><b>0</b><span>Followers</span></div>
          <div><b>0</b><span>Following</span></div>
        </div>
      </div>
    </section>
    </aside>

    <section class="card posts">
      <div class="q-wrap hidden" id="qWrap">
        <div class="q-head"><h3>Naka-pila sa device</h3><span class="faint small" id="qNet"></span></div>
        <div class="queue" id="queue"></div>
      </div>
      <div class="posts-head">
        <h3>Posts</h3>
        <div class="chips" role="tablist" aria-label="Filter posts" id="postChips">
          <button class="chip active" type="button" role="tab" aria-selected="true" data-f="all">All</button>
          <button class="chip" type="button" role="tab" aria-selected="false" data-f="photo">Photos</button>
          <button class="chip" type="button" role="tab" aria-selected="false" data-f="video">Videos</button>
          <button class="chip" type="button" role="tab" aria-selected="false" data-f="scheduled">Scheduled</button>
        </div>
      </div>
      <div class="post-grid" id="postGrid"></div>
      <div class="empty posts-empty hidden" id="postsEmpty">
        <div class="empty-art"><i data-icon="image" data-size="lg"></i></div>
        <h3 id="emptyTitle">Wala pang post</h3>
        <p id="emptyText">Pumili ng photo o video sa Gallery, tapos pindutin ang <b>Post</b>. Gumagana kahit offline.</p>
        <a class="btn btn-primary" href="gallery.html"><i data-icon="album" data-size="sm"></i>Buksan ang Gallery</a>
      </div>
    </section>
   </div>
  </main>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/nav-items.js"></script>
  <script src="../assets/js/components/app-shell.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components/modal.js"></script>
  <script src="../assets/js/post-queue.js"></script>
  <script src="../assets/js/components/post-viewer.js"></script>
  <script src="../assets/js/pages/profile.js"></script>
</body>
</html>
