<body data-page="reports">
  <main id="page" class="page wide">
    <header class="page-head">
      <div>
        <h1>Reports</h1>
        <p class="muted">Content reported by users or caught by the automatic filter. Hidden content is only visible to its owner until you decide.</p>
      </div>
    </header>
    <div class="segmented ar-tabs" role="tablist" aria-label="Report status" id="arTabs">
      <button type="button" role="tab" data-s="open" aria-pressed="true">Open <span class="badge" id="arOpen" translate="no"></span></button>
      <button type="button" role="tab" data-s="actioned" aria-pressed="false">Actioned</button>
      <button type="button" role="tab" data-s="dismissed" aria-pressed="false">Dismissed</button>
    </div>
    <div class="ar-list" id="arList"></div>
    <div class="empty hidden" id="arEmpty">
      <div class="empty-art"><i data-icon="shield" data-size="lg"></i></div>
      <h3 id="arEmptyTitle">All clear</h3>
      <p id="arEmptyText">No open reports right now.</p>
    </div>
  </main>
