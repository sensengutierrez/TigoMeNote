<body data-page="beta" data-title="Beta monitor">
  <!-- Beta monitor (pages/admin-beta.js, Admin lang): testers, bugs, errors/crash, bagal, at bilang ng content reports. Server: crash-fast -->
  <main id="page" class="page wide">
    <header class="page-head bm-head">
      <div>
        <h1>Beta monitor</h1>
        <p class="muted">Testers, bugs they report, app errors and crashes, and slow screens. Same problem = one row with a count.</p>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="bmRefresh"><i data-icon="refresh" data-size="sm"></i>Refresh</button>
    </header>
    <section class="bm-stats" id="bmStats" aria-label="Summary"></section>
    <div class="bm-bar">
      <div class="segmented bm-tabs" role="tablist" aria-label="View" id="bmTabs">
        <button type="button" role="tab" data-v="testers" aria-pressed="true">Testers</button>
        <button type="button" role="tab" data-v="bug" aria-pressed="false">Bugs <span class="badge" id="bmBugN" translate="no"></span></button>
        <button type="button" role="tab" data-v="crash" aria-pressed="false">Crashes</button>
        <button type="button" role="tab" data-v="error" aria-pressed="false">Errors</button>
        <button type="button" role="tab" data-v="slow" aria-pressed="false">Slow</button>
      </div>
      <div class="bm-filters" id="bmFilters">
        <select class="input bm-sel" id="bmApp" aria-label="App"><option value="">All apps</option><option value="main">TigoMeNote</option><option value="chat">Chat</option><option value="tigo">Tigo</option><option value="web">Web</option></select>
        <select class="input bm-sel" id="bmStatus" aria-label="Status"><option value="open">Open</option><option value="fixed">Fixed</option><option value="">All</option></select>
        <input class="input bm-q" id="bmQ" type="search" placeholder="Search" aria-label="Search">
      </div>
    </div>
    <div class="bm-list" id="bmList"></div>
    <div class="empty hidden" id="bmEmpty">
      <div class="empty-art"><i data-icon="check" data-size="lg"></i></div>
      <h3 id="bmEmptyTitle">All clear</h3>
      <p id="bmEmptyText">Nothing here right now.</p>
    </div>
  </main>
  <script src="../../assets/js/icons.js?v=0.11.46"></script>
