<body data-page="notifications">
  <main id="page" class="page">
    <div class="layout">
      <div class="nt-wrap">
        <header class="nt-head">
          <h1>Notifications</h1>
          <button class="icon-btn nt-gear" type="button" id="ntGear" aria-label="Notification settings" title="Notification settings"><i data-icon="gear"></i></button>
        </header>
        <section class="card nt-card">
          <div class="nt-list" id="ntList" role="list"></div>
          <div class="empty hidden" id="ntEmpty">
            <div class="empty-art"><i data-icon="bell" data-size="lg"></i></div>
            <h3 id="ntEmptyTitle">No notifications yet</h3>
            <p id="ntEmptyText">When people react, comment or follow you, you'll see it here.</p>
          </div>
        </section>
      </div>
      <aside class="layout-aside nt-aside">
        <section class="card">
          <h3 class="set-title">Notification settings</h3>
          <div id="ntSettings"></div>
        </section>
      </aside>
    </div>
  </main>
