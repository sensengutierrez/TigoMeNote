<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Explore · TigoMeNote</title>
  <script src="../assets/js/theme.js?v=0.5.0"></script>
  <script src="../assets/js/config.js?v=0.5.0"></script>
  <script src="../assets/js/i18n.js?v=0.5.0"></script>
  <script src="../assets/js/auth-guard.js?v=0.5.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css?v=0.5.0">
  <link rel="stylesheet" href="../assets/css/base.css?v=0.5.0">
  <link rel="stylesheet" href="../assets/css/components.css?v=0.5.0">
  <link rel="stylesheet" href="../assets/css/shell.css?v=0.5.0">
  <link rel="stylesheet" href="../assets/css/posts.css?v=0.5.0">
  <link rel="stylesheet" href="../assets/css/social.css?v=0.5.0">
  <link rel="stylesheet" href="../assets/css/pages/explore.css?v=0.5.0">
</head>
<body data-page="explore">
  <main id="page" class="page">
    <div class="layout">
      <div class="ex-main">
        <header class="ex-head">
          <h1>Explore</h1>
          <button class="icon-btn ex-find" type="button" id="findBtn" aria-label="Search people"><i data-icon="search"></i></button>
        </header>
        <section class="card ex-stories" id="stories" aria-label="Status"></section>
        <div class="segmented ex-tabs" role="tablist" id="tabs">
          <button type="button" role="tab" data-mode="all" aria-pressed="true"><i data-icon="globe" data-size="sm"></i>For you</button>
          <button type="button" role="tab" data-mode="following" aria-pressed="false"><i data-icon="users" data-size="sm"></i>Following</button>
        </div>
        <div class="feed" id="feed"></div>
        <div class="empty hidden" id="empty">
          <div class="empty-art"><i data-icon="compass" data-size="lg"></i></div>
          <h3 id="emptyTitle">No posts yet</h3>
          <p id="emptyText">Be the first! Pick a photo in Gallery and tap Post.</p>
          <a class="btn btn-primary" href="gallery.html" id="emptyBtn"><i data-icon="album" data-size="sm"></i>Open Gallery</a>
        </div>
        <div class="more-wrap"><button class="btn btn-ghost hidden" type="button" id="more">Load more</button></div>
      </div>

      <aside class="layout-aside ex-aside">
        <section class="card ex-people">
          <label class="search">
            <i data-icon="search"></i>
            <span class="sr-only">Search people</span>
            <input class="input" type="search" id="q" placeholder="Search people (name or @username)">
          </label>
          <div class="ex-results hidden" id="results"></div>
        </section>
        <section class="card ex-people">
          <h3>Suggested for you</h3>
          <div id="sugg"><p class="faint small sx-empty">Loading…</p></div>
        </section>
      </aside>
    </div>
  </main>
  <script src="../assets/js/icons.js?v=0.5.0"></script>
  <script src="../assets/js/nav-items.js?v=0.5.0"></script>
  <script src="../assets/js/components/app-shell.js?v=0.5.0"></script>
  <script src="../assets/js/api.js?v=0.5.0"></script>
  <script src="../assets/js/components/modal.js?v=0.5.0"></script>
  <script src="../assets/js/post-queue.js?v=0.5.0"></script>
  <script src="../assets/js/components/post-viewer.js?v=0.5.0"></script>
  <script src="../assets/js/components/post-card.js?v=0.5.0"></script>
  <script src="../assets/js/components/social-ui.js?v=0.5.0"></script>
  <script src="../assets/js/components/stories.js?v=0.5.0"></script>
  <script src="../assets/js/pages/explore.js?v=0.5.0"></script>
</body>
</html>
