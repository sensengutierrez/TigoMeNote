<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Explore · TigoMeNote</title>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/posts.css">
  <link rel="stylesheet" href="../assets/css/pages/explore.css">
</head>
<body data-page="explore">
  <main id="page" class="page wide">
    <header class="page-head">
      <div>
        <div class="eyebrow">Discover</div>
        <h1>Explore</h1>
        <p class="lead">Mga photo at video na shinare ng users.</p>
      </div>
    </header>

    <div class="explore-tools">
      <label class="search">
        <i data-icon="search"></i>
        <span class="sr-only">Search</span>
        <input class="input" type="search" id="q" placeholder="Hanapin sa caption o @username">
      </label>
      <div class="chips" role="tablist" aria-label="Filter" id="chips">
        <button class="chip active" type="button" role="tab" aria-selected="true" data-f="all">All</button>
        <button class="chip" type="button" role="tab" aria-selected="false" data-f="photo">Photos</button>
        <button class="chip" type="button" role="tab" aria-selected="false" data-f="video">Videos</button>
        <button class="chip" type="button" role="tab" aria-selected="false" data-f="mine">Akin</button>
      </div>
    </div>

    <div class="post-grid explore-grid" id="grid"></div>
    <div class="empty hidden" id="empty">
      <div class="empty-art"><i data-icon="compass" data-size="lg"></i></div>
      <h3 id="emptyTitle">Wala pang posts</h3>
      <p id="emptyText">Ikaw na ang mauna! Pumili ng photo sa Gallery at pindutin ang Post.</p>
      <a class="btn btn-primary" href="gallery.html" id="emptyBtn"><i data-icon="album" data-size="sm"></i>Buksan ang Gallery</a>
    </div>
    <div class="more-wrap"><button class="btn btn-ghost hidden" type="button" id="more">Load more</button></div>
  </main>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/nav-items.js"></script>
  <script src="../assets/js/components/app-shell.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components/modal.js"></script>
  <script src="../assets/js/post-queue.js"></script>
  <script src="../assets/js/components/post-viewer.js"></script>
  <script src="../assets/js/pages/explore.js"></script>
</body>
</html>
