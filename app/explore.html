<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Explore · TigoMeNote</title>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/pages/explore.css">
</head>
<body data-page="explore">
  <main id="page" class="page wide">
    <header class="page-head">
      <div>
        <div class="eyebrow">Discover</div>
        <h1>Explore</h1>
        <p class="lead">Photos and videos na shinare ng ibang users.</p>
      </div>
    </header>

    <div class="explore-tools">
      <label class="search">
        <i data-icon="search"></i>
        <span class="sr-only">Search</span>
        <input class="input" type="search" placeholder="Search people or posts" disabled>
      </label>
      <div class="chips" role="tablist" aria-label="Filter">
        <button class="chip active" type="button" role="tab" aria-selected="true">All</button>
        <button class="chip" type="button" role="tab" aria-selected="false">Photos</button>
        <button class="chip" type="button" role="tab" aria-selected="false">Videos</button>
        <button class="chip" type="button" role="tab" aria-selected="false">People</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="explore-grid" id="grid" aria-hidden="true"></div>
      <div class="grid-note card">
        <div class="empty-art"><i data-icon="compass" data-size="lg"></i></div>
        <h3>Explore opens soon</h3>
        <p class="muted">Lalabas dito ang posts pag live na ang Share.</p>
      </div>
    </div>
  </main>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/nav-items.js"></script>
  <script src="../assets/js/components/app-shell.js"></script>
  <script src="../assets/js/pages/explore.js"></script>
</body>
</html>
